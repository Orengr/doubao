server {
    listen 80;
    server_name 114.215.204.238 moin.moin520.me;
    root /var/www/html;
    index index.html;
    location /api/ { proxy_pass http://127.0.0.1:18800; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 300s; }
    location /chat { proxy_pass http://127.0.0.1:18800; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 300s; }
    location /lite/ { proxy_pass http://127.0.0.1:18800/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_read_timeout 300s; }
    location = /status { proxy_pass http://127.0.0.1:18800; proxy_set_header Host $host; }
    # ---- 1Panel 原样代理（安全入口+资源+API，同 18090 路径）----
    location /cSK41ajJX5 { proxy_pass http://127.0.0.1:18090; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 600s; proxy_buffering off; client_max_body_size 100m; }
    location = /panel { proxy_pass http://127.0.0.1:18800; proxy_set_header Host $host; }
    location /api/panel/ { proxy_pass http://127.0.0.1:18800; proxy_set_header Host $host; }
    location /assets/ { proxy_pass http://127.0.0.1:18090; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/v1/ { proxy_pass http://127.0.0.1:18090; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /version { proxy_pass http://127.0.0.1:18090; proxy_set_header Host $host; }
    # ---- 1Panel end ----
    location /dl/ { alias /var/www/dl/; autoindex on; autoindex_exact_size off; autoindex_localtime on; charset utf-8; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    server_name panel.moin520.me;
    location / { proxy_pass http://127.0.0.1:18090; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 600s; proxy_buffering off; client_max_body_size 100m; }
}
