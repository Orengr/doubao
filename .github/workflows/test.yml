name: Self Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome || true

      - name: Run self test
        run: bash test.sh

      - name: Verify shell syntax
        run: |
          for f in bin/*.sh install.sh test.sh; do
            bash -n "$f" || exit 1
          done
          echo "All shell scripts OK"

      - name: Verify Python syntax
        run: |
          for f in bin/*.py; do
            python3 -c "import ast; ast.parse(open('$f').read())" || exit 1
          done
          echo "All Python files OK"
